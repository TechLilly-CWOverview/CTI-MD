                <th>
                    <div class="th-container">
                        <span>${col}</span>
                        <div class="sort-filter-btns">
                            <button class="sort-btn" type="button" onclick="sortByColumn('${col}', event)" title="Sort">↕</button>
                            <button class="filter-btn" type="button" onclick="openFilter('${col}', ${idx}, event)" title="Filter">🔽</button>
                        </div>
                    </div>
                </th>
            `).join('');
        }

        function sortByColumn(field, event) {
            event.preventDefault();
            event.stopPropagation();
            if (sortField === field) {
                sortDirection = sortDirection === 'asc' ? 'desc' : 'asc';
            } else {
                sortField = field;
                sortDirection = 'asc';
            }
            applyAllFilters();
        }

        function openFilter(field, colIdx, event) {
            event.preventDefault();
            event.stopPropagation();
            
            const popup = document.getElementById('filterPopup');
            if (!popup) return;
            
            // Get unique values for this column
            const uniqueVals = [...new Set(allData.map(row => row[field]).filter(v => v))].sort();
            const selected = selectedValues[field] || [];
            
            let html = `
                <input type="text" id="filterSearch" class="filter-search" placeholder="Search...">
                <div class="filter-all-buttons">
                    <button class="filter-all-btn" type="button" onclick="selectAllFilterValues('${field}')">Select All</button>
                    <button class="filter-all-btn" type="button" onclick="clearAllFilterValues('${field}')">Clear All</button>
                </div>
                <div class="filter-options" id="filterOptions">
            `;
            
            uniqueVals.forEach((val, vidx) => {
                const isChecked = selected.includes(val) ? 'checked' : '';
                const displayVal = val || '(Blank)';
                const checkId = 'chk_' + field + '_' + vidx;
                html += `
                    <div class="filter-option">
                        <input type="checkbox" id="${checkId}" value="${val}" ${isChecked} onchange="updateSelectedFilterValues('${field}')">
                        <label for="${checkId}">${displayVal}</label>
                    </div>
                `;
            });
            
            html += `
                </div>
                <div class="filter-popup-buttons">
                    <button class="filter-clear" type="button" onclick="clearColumnFilter('${field}')">Clear</button>
                    <button class="filter-apply" type="button" onclick="applyColumnFilter('${field}')">Filter</button>
                </div>
            `;
            
            popup.innerHTML = html;
            
            const headerCell = event.target.closest('th');
            if (headerCell) {
                const tableWrapper = document.querySelector('.table-wrapper');
                if (tableWrapper) {
                    const rect = headerCell.getBoundingClientRect();
                    const tableRect = tableWrapper.getBoundingClientRect();
                    popup.style.display = 'block';
                    popup.style.left = Math.max(0, rect.left - tableRect.left + window.scrollX) + 'px';
                    popup.style.top = Math.max(0, rect.bottom - tableRect.top + window.scrollY) + 'px';
                }
            }
            
            setTimeout(() => {
                const filterSearch = document.getElementById('filterSearch');
                if (filterSearch) {
                    filterSearch.addEventListener('keyup', function() {
                        filterPopupOptions('${field}');
                    });
                    filterSearch.focus();
                }
            }, 100);
        }

        function filterPopupOptions(field) {
            const filterSearch = document.getElementById('filterSearch');
            if (!filterSearch) return;
            const searchVal = (filterSearch.value || '').toLowerCase();
            document.querySelectorAll('.filter-option').forEach(option => {
                const label = option.querySelector('label');
                if (label) {
                    const text = (label.textContent || '').toLowerCase();
                    option.style.display = text.includes(searchVal) ? 'flex' : 'none';
                }
            });
        }

        function updateSelectedFilterValues(field) {
            const checkboxes = document.querySelectorAll('#filterOptions input[type="checkbox"]:checked');
            const selected = [];
            checkboxes.forEach(cb => {
                selected.push(cb.value || '');
            });
            selectedValues[field] = selected;
        }

        function selectAllFilterValues(field) {
            document.querySelectorAll('#filterOptions input[type="checkbox"]').forEach(cb => {
                if (cb.style.display !== 'none') cb.checked = true;
            });
            updateSelectedFilterValues(field);
        }

        function clearAllFilterValues(field) {
            document.querySelectorAll('#filterOptions input[type="checkbox"]').forEach(cb => {
                cb.checked = false;
            });
            updateSelectedFilterValues(field);
        }

        function applyColumnFilter(field) {
            const selected = selectedValues[field] || [];
            if (selected.length > 0) {
                columnFilters[field] = selected;
            } else {
                delete columnFilters[field];
            }
            const popup = document.getElementById('filterPopup');
            if (popup) popup.style.display = 'none';
            applyAllFilters();
        }

        function clearColumnFilter(field) {
            delete columnFilters[field];
            delete selectedValues[field];
            const popup = document.getElementById('filterPopup');
            if (popup) popup.style.display = 'none';
            applyAllFilters();
        }

        function applyAllFilters() {
            filteredData = allData.filter(row => {
                if (searchTerm) {
                    const match = columnNames.some(col => String(row[col] || '').toLowerCase().includes(searchTerm));
                    if (!match) return false;
                }
                for (const [col, selectedVals] of Object.entries(columnFilters)) {
                    if (!selectedVals.includes(String(row[col] || ''))) return false;
                }
                return true;
            });
            
            if (sortField) sortData();
            currentPage = 1;
            renderTable();
            updatePagination();
            updateFilterIndicators();
        }

        function updateFilterIndicators() {
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            columnNames.forEach((col, idx) => {
                if (columnFilters[col]) {
                    const buttons = document.querySelectorAll('.filter-btn');
                    if (buttons[idx]) buttons[idx].classList.add('active');
                }
            });
        }

        function sortData() {
            filteredData.sort((a, b) => {
                let aVal = a[sortField];
                let bVal = b[sortField];
                if (!isNaN(aVal) && !isNaN(bVal)) {
                    aVal = parseFloat(aVal) || 0;
                    bVal = parseFloat(bVal) || 0;
                } else {
                    aVal = String(aVal || '').toLowerCase();
                    bVal = String(bVal || '').toLowerCase();
                }
                if (aVal < bVal) return sortDirection === 'asc' ? -1 : 1;
                if (aVal > bVal) return sortDirection === 'asc' ? 1 : -1;
                return 0;
            });
        }

        function renderTable() {
            const start = (currentPage - 1) * rowsPerPage;
            const end = Math.min(start + rowsPerPage, filteredData.length);
            
            let html = '';
            for (let i = start; i < end; i++) {
                const row = filteredData[i];
                html += '<tr>';
                for (const col of columnNames) {
                    const val = row[col] || '-';
                    html += `<td>${val}</td>`;
                }
                html += '</tr>';
            }
            
            document.getElementById('tableBody').innerHTML = html || `<tr><td colspan="${columnNames.length}" style="text-align:center;padding:20px;">No data</td></tr>`;
        }

        function updatePagination() {
            const totalRecords = filteredData.length;
            const totalPages = Math.ceil(totalRecords / rowsPerPage) || 1;
            const start = totalRecords === 0 ? 0 : (currentPage - 1) * rowsPerPage + 1;
            const end = Math.min(currentPage * rowsPerPage, totalRecords);
            
            document.getElementById('currentPage').textContent = currentPage;
            document.getElementById('currentPage2').textContent = currentPage;
            document.getElementById('totalPages').textContent = totalPages;
            document.getElementById('totalPages2').textContent = totalPages;
            document.getElementById('startRecord').textContent = start;
            document.getElementById('endRecord').textContent = end;
            document.getElementById('totalRecords').textContent = totalRecords;
            
            document.getElementById('prevBtn').disabled = currentPage === 1;
            document.getElementById('prevBtn2').disabled = currentPage === 1;
            document.getElementById('nextBtn').disabled = currentPage >= totalPages;
            document.getElementById('nextBtn2').disabled = currentPage >= totalPages;
        }

        function prevPage() {
            if (currentPage > 1) { currentPage--; renderTable(); updatePagination(); }
        }

        function nextPage() {
            const totalPages = Math.ceil(filteredData.length / rowsPerPage) || 1;
            if (currentPage < totalPages) { currentPage++; renderTable(); updatePagination(); }
        }

        function resetAll() {
            document.getElementById('searchInput').value = '';
            searchTerm = '';
            columnFilters = {};
            selectedValues = {};
            filteredData = [...allData];
            sortField = null;
            sortDirection = 'asc';
            currentPage = 1;
            renderTable();
            updatePagination();
            updateFilterIndicators();
            const popup = document.getElementById('filterPopup');
            if (popup) popup.style.display = 'none';
        }

        function exportToCSV() {
            let csv = columnNames.join(',') + '\n';
            for (const row of filteredData) {
                csv += columnNames.map(col => `"${(row[col] || '').toString().replace(/"/g, '""')}"`).join(',') + '\n';
            }
            const blob = new Blob([csv], { type: 'text/csv' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = 'Beeline_' + new Date().toISOString().split('T')[0] + '.csv';
            link.click();
        }

        document.addEventListener('click', (e) => {
            const popup = document.getElementById('filterPopup');
            if (popup && e.target.id !== 'filterSearch' && !e.target.closest('.filter-popup')) {
                popup.style.display = 'none';
            }
        });

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    </script>
</body>
</html>
